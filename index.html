<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e8">
  <title>For You ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Homemade+Apple&family=Zeyada&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="scene" aria-label="A collection of love notes">
    <div class="paper heart" aria-hidden="true"></div>

    <!-- Images are in the repository root, so do not use /images/... -->
    <div class="paper image">
      <p>and I fallen in</p>
      <p>Love with You 😍</p>
      <img src="./first.jpeg" alt="Memory 1" draggable="false">
    </div>

    <div class="paper image">
      <img src="./second.jpeg" alt="Memory 2" draggable="false">
    </div>

    <div class="paper image">
      <p>How can be</p>
      <p>someone so cute ❤️</p>
      <img src="./third.jpeg" alt="Memory 3" draggable="false">
    </div>

    <div class="paper red">
      <p class="p1">and My Favorite</p>
      <p class="p2">Person 😍</p>
    </div>

    <div class="paper">
      <p class="p1">You are Cute</p>
      <p class="p1">Amazing <span class="love">❤️</span></p>
    </div>

    <div class="paper instruction">
      <p class="p1">Drag the papers to move!</p>
      <p class="mobile-hint">Touch and drag on your phone ❤️</p>
    </div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
